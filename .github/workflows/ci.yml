name: CI

# Manual only: nothing runs on a push, a pull request or a schedule. The
# checks, the Jetson builds, the experiments and the release checks run
# locally (AGENTS.md, "Checks and releases"); this workflow stays for a
# later use, by workflow dispatch. Its plan job still knows the rules it
# had for pushes (documentation only, another branch, nightly), unused now.
on:
  workflow_dispatch:
    inputs:
      check:
        description: Run nix flake check (off to run only the jobs chosen below)
        type: boolean
        default: true
      jetson:
        description: Also build the orin-agx-devkit system on an arm64 runner (hours)
        type: boolean
        default: false
      placement:
        description: Also run the S2 placement experiment, full matrix (two VMs, KVM, about 40 min)
        type: boolean
        default: false
      repeated:
        description: Also run the repeated matrix, 6 runs per cell and the measured TTFT, one job per scenario (hours)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # plan: did this commit already pass its VM tests?

# A newer push or pull request update cancels the run it supersedes; a
# dispatch or the nightly run is never cancelled by one.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # nix flake check, split into parallel jobs so that none approaches its time
  # limit. `plan` lists every check of the flake and gives each to a job by
  # rule: one job per VM test, one for every board's evaluation, one for the
  # rest. A new check is therefore always run. It also decides, by the rules
  # above, whether the VM tests run.
  plan:
    name: list the checks
    if: github.event_name != 'workflow_dispatch' || inputs.check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # to see what a push changed
      - uses: cachix/install-nix-action@v31
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          docs='^(README\.md|CHANGELOG\.md|AGENTS\.md|NOTICE|LICENSE|manual/.*|branding/.*|.*\.md)$'
          vm=true run=true why="every check"
          known() { [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; }
          if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ]; then
            vm=false why="a branch other than main: no VM tests"
          elif { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; } && known && git diff --name-only "$BEFORE" "$SHA" > changed.txt && ! grep -qvE "$docs" changed.txt; then
            vm=false why="documentation only: no VM tests"
          elif [ "$EVENT" = schedule ]; then
            for id in $(gh api "repos/$REPO/actions/runs?head_sha=$SHA&status=success&per_page=50" --jq '.workflow_runs[] | select(.name == "CI") | .id'); do
              passed=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select((.name | startswith("check vm-")) and .conclusion == "success")] | length')
              if [ "$passed" -gt 0 ]; then run=false why="nightly: $SHA already passed its VM tests (run $id)"; break; fi
            done
          fi
          echo "$why"
          nix eval --json .#checks.x86_64-linux --apply builtins.attrNames > checks.json
          jq -c --argjson vm "$vm" '{include: (
            (if $vm then [.[] | select(startswith("vm-")) | {group: ., checks: .}] else [] end)
            + [{group: "eval", checks: ([.[] | select(startswith("eval-"))] | join(" "))}]
            + [{group: "lint", checks: ([.[] | select((startswith("vm-") or startswith("eval-")) | not)] | join(" "))}]
          )}' checks.json > matrix.json
          cat checks.json matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  check:
    name: check ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      # Room for VM images and installer ISOs; swap for evaluating every
      # target, which holds about 12 GiB at its peak, mostly cold. Deleting
      # the runner's toolchains takes 1 to 5 min, so the jobs that fit in the
      # 14 GB a runner has free skip it (their closures: 1.8 to 3.1 GiB). A
      # new check gets the room until it is known to fit.
      - name: Disk room
        if: ${{ !contains(fromJSON('["lint", "vm-base", "vm-runtime", "vm-s2-link", "vm-s2-placement", "vm-update-rollback"]'), matrix.group) }}
        run: |
          echo "CPUs: $(nproc)"; free -h; df -h /; ls -l /dev/kvm || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - name: Swap
        if: matrix.group == 'eval'
        run: |
          sudo fallocate -l 12G /omarchy-swap && sudo chmod 600 /omarchy-swap
          sudo mkswap /omarchy-swap && sudo swapon /omarchy-swap
          free -h
      # Also enables KVM for the VM tests (enable_kvm defaults to true).
      - uses: cachix/install-nix-action@v31
      # What nix flake check adds to building the checks: every output evaluates.
      - name: Every output evaluates
        if: matrix.group == 'eval'
        run: nix flake check --no-build -L
      - name: Build ${{ matrix.checks }}
        run: |
          targets=()
          for check in ${{ matrix.checks }}; do targets+=(".#checks.x86_64-linux.$check"); done
          nix build -L --no-link "${targets[@]}"
      - name: Evaluate every board's installer image (aarch64, one process each)
        if: matrix.group == 'eval'
        run: |
          for image in $(nix eval --json .#packages.aarch64-linux --apply builtins.attrNames | jq -r '.[]'); do
            echo "$image: $(nix eval --raw ".#packages.aarch64-linux.$image.drvPath")"
          done
      # No Nix store cache: these jobs spend their time running VMs and
      # evaluating, and download what they need from cache.nixos.org; saving
      # gigabytes into the Actions cache (10 GB per repository) would cost
      # more minutes than it saves. What a job used, to keep the room right:
      - name: Disk used
        if: always()
        run: df -h /

  # The S2 placement experiment, every network profile and S2 time to first
  # token, alone on its runner so that no other VM test shares its CPUs. Its
  # results (results.json, table.txt, table.md, traces) are an artifact; the
  # README and manual tables are regenerated from it with
  # `omarchy-runtime placement-docs`.
  s2-placement:
    name: S2 placement experiment, full matrix (x86_64, KVM)
    if: github.event_name == 'workflow_dispatch' && inputs.placement
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
      - name: Machine
        run: |
          echo "CPUs: $(nproc)"; free -h; ls -l /dev/kvm || true
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-placement-${{ hashFiles('flake.lock', '**/*.nix', 'pkgs/**') }}
          restore-prefixes-first-match: nix-check-
          save: false
      - run: nix build -L .#s2-placement -o s2-placement
      - run: cat s2-placement/placement/table.txt
      - run: cp -rL s2-placement s2-placement-results
      - uses: actions/upload-artifact@v4
        with:
          name: s2-placement-${{ github.sha }}
          path: s2-placement-results

  # The repeated matrix: every cell run 6 times, the measured S2 TTFT besides
  # 0.1, 1 and 5 s, one scenario per job, each alone on its runner. The
  # artifacts are merged with `omarchy-runtime placement-merge`.
  s2-placement-repeated:
    name: S2 placement, repeated, ${{ matrix.scenario }} (x86_64, KVM)
    if: github.event_name == 'workflow_dispatch' && inputs.repeated
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        scenario: [s2_placement, cup_moved, slot_blocked, fallback_expiry]
    steps:
      - uses: actions/checkout@v5
      - name: Machine
        run: |
          echo "CPUs: $(nproc)"; free -h; ls -l /dev/kvm || true
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#s2-placement-repeated-${{ matrix.scenario }} -o s2-placement
      - run: cat s2-placement/placement/table.txt
      - run: cp -rL s2-placement s2-placement-results
      - uses: actions/upload-artifact@v4
        with:
          name: s2-placement-repeated-${{ matrix.scenario }}-${{ github.sha }}
          path: s2-placement-results

  jetson:
    name: build orin-agx-devkit (aarch64)
    if: github.event_name == 'workflow_dispatch' && inputs.jetson
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the BSP and kernel build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache && df -h /
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#nixosConfigurations.orin-agx-devkit.config.system.build.toplevel
      - run: nix path-info -Sh ./result
