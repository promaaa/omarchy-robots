description = """nominal_a, but the gripper is stuck open (an actuator fault). S1 keeps
planning the grasp again, since proprioception shows the gripper off its plan,
until the deadline. S0 did not achieve the intent (the gripper never closed):
the failure is attributed to EXECUTION."""
seed = 1
body = "arm3"
limit_s = 20.0

[runtime]
deadline_s = 10.0

[s1]
latency_s = 0.05

[s2]
latency_s = 0.1
goals = [{ predicate = "in", args = ["cup_1", "drying_rack"] }]

[[faults]]
kind = "gripper_stuck"
after = "start"
delay_s = 0.0
duration_s = 30.0

[[expect]]
outcome = "FAILED"
category = "TIMEOUT"
truth = false
attribution = "EXECUTION"
