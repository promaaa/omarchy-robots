# The runtime's parameters, in simulated seconds. A scenario may override any
# of them in its own [runtime] or [verification] table.

[runtime]
deadline_s = 60.0  # longest an execution may run
s1_stall_timeout_s = 3.0  # S1 is stalled after this long without a chunk reaching S0
freshness_s = 1.0  # how recent an estimate must be for preconditions and the already-satisfied check

[verification]
settle_s = 0.3  # wait after the executor's claim before trusting observations
budget_s = 2.0  # then give the verifier this long to decide
margin_m = 0.01  # positions this close to a boundary are UNKNOWN
min_confidence = 0.5
grasp_radius_m = 0.03  # an object this close to a closed gripper is held
contradiction_m = 0.05  # two sources seeing one entity this far apart, confidently,
contradiction_s = 0.1  # at most this far apart in time: the belief is contradictory

[fidelity]  # S0's fidelity to the intent it executed (attribution.py): below these, S0 did not achieve it
tracking = 0.05  # the largest mean tracking error, in the motion's units (rad, m)
contact_mode = 0.9  # the least share of steady contact ticks (FREE, MAINTAIN) in the mode requested
force = 0.8  # the least share of MAINTAIN ticks with the force within its bounds
object_m = 0.01  # the largest mean error of an object against its intent

[s2_link]  # S2 in another process (omarchy-runtime s2), on the wall clock
heartbeat_s = 0.1  # S2 sends a heartbeat this often (it learns the period from the robot's hello)
lost_s = 0.5  # no heartbeat for longer than this: the supervisor records the link as lost
long_s = 2.0  # an outage this long or longer is long (a link failure); a shorter one is short (TCP retransmission)
reconnect_s = 3.0  # the robot drops a connection on which S2 has been silent this long, and connects again
reconnect_backoff_s = 0.25  # first wait between connection attempts; it doubles
reconnect_backoff_max_s = 2.0  # up to this
connect_attempt_s = 1.0  # one connection attempt waits at most this long

[s1_host]  # parameters of the robot-side S1 extensions
blend_s = 0.1  # corrector "blend": the window over which S0's position blends into a new chunk
mismatch = 0.02  # trigger "mismatch": infer when S0's state is this far (action-space units) from what it tracks

[extensions]  # ids from omarchy_runtime/extensions.py
filter = "identity"
recovery = "retry_once"
s2_latency = "fixed"
corrector = "none"  # ChunkCorrector, applied when a chunk is handed to S0
trigger = "periodic"  # InferenceTrigger, asked at S1's rate

[extensions.verifiers]  # per predicate
in = "geometric"
on = "geometric"
held = "geometric"
