# The simulated kitchen, in a vertical plane: metres, x to the right, z up.
# The runtime's belief gets the geometry of surfaces and regions and the size
# of objects; the objects' positions here are the simulator's ground truth.

[surfaces.counter]  # the drying rack stands on it
x0 = 0.15
x1 = 0.50
z = 0.75

[surfaces.table]
x0 = 0.50
x1 = 1.05
z = 0.75

[regions.drying_rack]
x0 = 0.22
x1 = 0.48
z0 = 0.75
z1 = 0.95

[objects.cup_1]
width = 0.08
height = 0.10
x = 0.78  # resting on the table

[objects.cup_2]
width = 0.08
height = 0.10
x = 0.92

[objects.dish_1]  # absent until a scenario makes it appear (slot_blocked)
width = 0.08
height = 0.10
present = false

[sensor]  # structured detections, no images
source = "sim.camera"
noise_m = 0.003  # standard deviation of each coordinate
confidence = 0.95

[s0]  # the simulated S0
late_after_periods = 1.5  # a tick later than this many nominal periods after the one before is a late tick

[rates_hz]  # simulated rates
s0 = 1000
s1 = 20
supervisor = 20
observation = 20
s2 = 10

# On the wall clock (--clock wall), these replace the rates above. Python on a
# general-purpose OS did not keep S0 at 1 kHz in a KVM VM (overruns in 6 to 20 %
# of its steps); at 200 Hz it overran at most twice per run (README). `link`, the
# robot's end of the link to an S2 process, is polled at 1 kHz: an echo waits at
# most 1 ms.
[wall_rates_hz]
s0 = 200
link = 1000
