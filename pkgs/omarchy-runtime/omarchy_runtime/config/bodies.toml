# Robot bodies. Each has its own action space: the runtime and S2 only see
# this description; the simulator and the scripted policy also use
# `kinematics`. Positions: radians for joints, metres for axes; the gripper
# dimension goes from 0 (closed) to 1 (open).

[arm3]  # body A: a planar arm with three revolute joints and a gripper pointing down
kind = "planar_arm"
action_space = "planar_arm3.joint_position.v1"
dims = ["shoulder", "elbow", "wrist", "gripper"]
lower = [0.3, -3.0, -1.8, 0.0]
upper = [2.6, -0.5, 0.1, 1.0]
max_velocity = [1.2, 1.2, 1.2, 2.5]
workspace = [0.15, 1.00, 0.80, 1.15]  # x0, x1, z0, z1 of the gripper
features = ["gripper"]
home = [1.3523, -1.8986, -1.0245, 1.0]  # gripper at (0.60, 1.05), open
safe_pose = [1.4883, -1.9156, -1.1434, 0.0]  # gripper at (0.55, 1.12), closed

[arm3.kinematics]
base = [0.0, 0.90]
links = [0.60, 0.55, 0.15]

[gantry]  # body B: a Cartesian gantry moving the gripper in x and z
kind = "gantry"
action_space = "gantry_xz.cartesian_position.v1"
dims = ["x", "z", "gripper"]
lower = [0.10, 0.80, 0.0]
upper = [1.05, 1.25, 1.0]
max_velocity = [0.5, 0.5, 2.5]
workspace = [0.10, 1.05, 0.80, 1.25]
features = ["gripper"]
home = [0.60, 1.10, 1.0]
safe_pose = [0.55, 1.20, 0.0]

[gantry.kinematics]
