# Capabilities say which goal predicate they achieve, what the body must have
# and what must hold before they start. Bindings say which implementation runs
# a capability on which bodies; the resolver picks the highest priority.
#
# Preconditions: "observed <param>" (a fresh, confident estimate) and
# "reachable <param>" (inside the body's workspace).
#
# default_fallback: the generator (extensions.py, DEFAULT_FALLBACKS) of the
# fallback S0 holds while the capability runs, before S2's and with no gap.

[capabilities.place_in]
achieves = "in"
params = ["object", "container"]
requires = ["gripper"]
preconditions = ["observed object", "reachable object", "reachable container"]
default_fallback = "lift"  # hold where S0 is; holding an object, rise 2 cm first (bodies with z)

[[bindings]]
capability = "place_in"
implementation = "pick_place.arm3"
version = "1"
bodies = ["arm3"]
priority = 10

[[bindings]]
capability = "place_in"
implementation = "pick_place.gantry"
version = "1"
bodies = ["gantry"]
priority = 10

[capabilities.wipe]
achieves = "clean"
params = ["surface"]
requires = ["contact"]
preconditions = ["observed surface", "reachable surface"]
default_fallback = "retreat"  # leave contact upwards, compliant along z (Cartesian bodies)

[[bindings]]
capability = "wipe"
implementation = "wipe.panda"
version = "1"
bodies = ["panda"]
priority = 10
