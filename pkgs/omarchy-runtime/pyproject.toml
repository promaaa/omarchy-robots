[project]
name = "omarchy-runtime"
version = "0.1.0"
description = "Omarchy Robots runtime: goals in, verified executions and complete traces out (simulated)"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["numpy"]

[project.scripts]
omarchy-runtime = "omarchy_runtime.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omarchy_runtime*"]

[tool.setuptools.package-data]
omarchy_runtime = ["config/*.toml", "scenarios/*.toml", "data/*.json", "data/latency/*.json"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "PLW", "BLE", "EXE"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]  # MuJoCo and openpi-client ship no type information; sim/panda.py and sim/vla.py import them
module = ["mujoco", "mujoco.*", "piper_sdk", "piper_sdk.*", "openpi_client", "openpi_client.*"]
ignore_missing_imports = true
