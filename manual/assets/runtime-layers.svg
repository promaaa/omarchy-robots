<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-labelledby="t d">
<title id="t">S2, the runtime, S1 and S0</title>
<desc id="d">S2 sends goals, fallbacks and decisions to the runtime and gets execution updates and verdicts back. The runtime starts and stops S1, samples S0's status at 20 Hz and passes S2's fallback to S0. S1 sends action chunks to S0 directly, and S0 commands the body.</desc>
<style>
svg { --fg: #1f2328; --bg: #fbfaf7; }
@media (prefers-color-scheme: dark) { svg { --fg: #c0caf5; --bg: #1a1b26; } }
text { fill: var(--fg); font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
rect { fill: none; stroke: var(--fg); stroke-width: .9; }
.e { fill: none; stroke: var(--fg); stroke-width: .9; }
.e.fast { stroke-width: 2.6; }
.e.dash { stroke-dasharray: 3 3; }
.head { fill: var(--fg); }
.t { font-size: 16px; font-weight: 600; }
.s { font-size: 13px; font-style: italic; }
.j { font-size: 13px; }
.l { font-size: 13px; font-style: italic; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" class="head"/>
</marker>
</defs>
<g class="n n-s2">
<rect x="10" y="35" width="130" height="64"/>
<text class="t" x="75.0" y="65.0" text-anchor="middle">S2</text>
<text class="s" x="75.0" y="82.0" text-anchor="middle">planner</text>
</g>
<g class="n n-rt">
<rect x="330" y="20" width="340" height="96"/>
<text class="t" x="500.0" y="54" text-anchor="middle">runtime</text>
<text class="s" x="500.0" y="72" text-anchor="middle">control plane</text>
<text class="j" x="500.0" y="98" text-anchor="middle">resolve · supervise · verify · belief · traces</text>
</g>
<g class="n n-s1">
<rect x="330" y="200" width="110" height="56"/>
<text class="t" x="385.0" y="226.0" text-anchor="middle">S1</text>
<text class="s" x="385.0" y="243.0" text-anchor="middle">policy</text>
</g>
<g class="n n-s0">
<rect x="560" y="200" width="110" height="56"/>
<text class="t" x="615.0" y="233.0" text-anchor="middle">S0</text>
</g>
<g class="n n-body">
<rect x="740" y="200" width="70" height="56"/>
<text class="t" x="775.0" y="233.0" text-anchor="middle">body</text>
</g>
<polyline class="e plain" points="140,55 330,55" marker-end="url(#arrow)"/>
<text class="l plain" x="235" y="46" text-anchor="middle">goals, fallbacks, decisions</text>
<polyline class="e plain" points="330,80 140,80" marker-end="url(#arrow)"/>
<text class="l plain" x="235" y="98" text-anchor="middle">execution updates, verdicts</text>
<polyline class="e plain" points="385,116 385,200" marker-end="url(#arrow)"/>
<text class="l plain" x="377" y="162" text-anchor="end">start / stop</text>
<polyline class="e dash" points="595,200 595,116" marker-end="url(#arrow)"/>
<text class="l dash" x="587" y="155" text-anchor="end">S0 status,</text>
<text class="l dash" x="587" y="170" text-anchor="end">sampled at 20 Hz</text>
<polyline class="e fb" points="645,116 645,200" marker-end="url(#arrow)"/>
<text class="l fb" x="653" y="162" text-anchor="start">fallback</text>
<polyline class="e fast" points="440,228 560,228" marker-end="url(#arrow)"/>
<text class="l fast" x="500" y="220" text-anchor="middle">action chunks</text>
<polyline class="e fast" points="670,228 740,228" marker-end="url(#arrow)"/>
</svg>
